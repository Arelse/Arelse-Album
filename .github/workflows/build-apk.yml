name: Build Arelsync APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons from assets/icon.png
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f0f14' --iconBackgroundColorDark '#0f0f14'

      - name: Register as an image viewer (Open-with option)
        run: |
          node -e "
            const fs = require('fs');
            const path = 'android/app/src/main/AndroidManifest.xml';
            let xml = fs.readFileSync(path, 'utf8');
            const extra = '<intent-filter><action android:name=\"android.intent.action.VIEW\" /><category android:name=\"android.intent.category.DEFAULT\" /><category android:name=\"android.intent.category.BROWSABLE\" /><data android:mimeType=\"image/*\" /></intent-filter>';
            xml = xml.replace('</activity>', extra + '</activity>');
            fs.writeFileSync(path, xml);
            console.log('Patched AndroidManifest.xml with image-viewer intent filter');
          "

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arelsync-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
